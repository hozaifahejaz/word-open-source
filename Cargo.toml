[workspace]
members = ["crates/document-core", "crates/docx", "apps/desktop"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
authors = ["hozaifahejaz"]
license = "MIT"

[workspace.dependencies]
document-core = { path = "crates/document-core" }
folio-docx = { path = "crates/docx" }
unicode-segmentation = "=1.12.0"
quick-xml = "=0.38.3"
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }
egui = "=0.32.3"
eframe = { version = "=0.32.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
rfd = "=0.15.4"
